<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peak Ooru: the sounds</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #26231f;
        --muted: #6f6a62;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
      }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: #f3f0ea;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      p {
        line-height: 1.5;
      }
      .muted {
        color: var(--muted);
      }
      .sound {
        background: #fffdf9;
        border: 1px solid rgba(38, 35, 31, 0.08);
        border-radius: 12px;
        padding: 12px 14px;
        margin: 10px 0;
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 12px;
        align-items: center;
      }
      button {
        min-height: 44px;
        border-radius: 10px;
        border: 0;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0 16px;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
      }
      .figures {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        margin: 4px 0 0;
      }
      @media (max-width: 600px) {
        .sound {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The sounds of Peak Ooru</h1>
      <p class="muted">
        Nobody who made these has heard them. Press each one and say which are wrong: too loud, too harsh, too long, or
        not wanted at all. Each is drawn beside its button: its shape over time above, the pitches in it below.
      </p>
      <div id="list"></div>
    </main>
    <script type="module">
      import { lengthOf, notes, play, SCALE } from '../src/sound/voices.ts'

      const RATE = 48000
      const SOUNDS = [
        ['tap', 'A press', {}],
        ['placed', 'A stop or station placed', {}],
        ['changed', 'A lever moved', {}],
        ['built', 'A plan ordered', {}],
        ['refused', 'Refused', {}],
        ['month', 'A month ended, score up', { change: 5 }],
        ['month', 'A month ended, score down', { change: -5 }],
        ['month', 'A month ended, no change', { change: 0 }],
        ['opened', 'Something opened', {}],
        ['review', 'The yearly review', {}],
        ['ended', 'The ending', {}],
      ]

      let live = null
      /** Renders a sound offline, as the game would play it, and gives its samples. */
      async function render(list) {
        const length = Math.ceil((lengthOf(list) + 0.05) * RATE)
        const ctx = new OfflineAudioContext(1, length, RATE)
        play(ctx, list, 0)
        return (await ctx.startRendering()).getChannelData(0)
      }

      const db = (x) => (x > 0 ? 20 * Math.log10(x) : -Infinity)

      /** Length, peak, loudness (RMS over the sounding part), the first and last samples, and the largest jump. */
      function measure(data) {
        let peak = 0
        let last = 0
        let jump = 0
        for (let i = 0; i < data.length; i++) {
          const a = Math.abs(data[i])
          if (a > peak) peak = a
          if (a > 1e-4) last = i
          if (i) jump = Math.max(jump, Math.abs(data[i] - data[i - 1]))
        }
        let sum = 0
        for (let i = 0; i <= last; i++) sum += data[i] * data[i]
        const edge = Math.round(RATE * 0.001)
        let head = 0
        let tail = 0
        for (let i = 0; i < edge; i++) head = Math.max(head, Math.abs(data[i]))
        for (let i = data.length - edge; i < data.length; i++) tail = Math.max(tail, Math.abs(data[i]))
        return {
          seconds: +(last / RATE).toFixed(3),
          peakDb: +db(peak).toFixed(1),
          rmsDb: +db(Math.sqrt(sum / Math.max(1, last + 1))).toFixed(1),
          first: data[0],
          last: data[data.length - 1],
          headMax: +head.toFixed(5),
          tailMax: +tail.toFixed(6),
          jump: +jump.toFixed(4),
        }
      }

      /** The magnitude of each frequency, by a plain FFT of the sound padded to a power of two. */
      function spectrum(data) {
        let n = 1
        while (n < data.length) n *= 2
        const re = new Float64Array(n)
        const im = new Float64Array(n)
        re.set(data)
        for (let i = 1, j = 0; i < n; i++) {
          let bit = n >> 1
          for (; j & bit; bit >>= 1) j ^= bit
          j ^= bit
          if (i < j) {
            ;[re[i], re[j]] = [re[j], re[i]]
          }
        }
        for (let len = 2; len <= n; len *= 2) {
          const ang = (-2 * Math.PI) / len
          for (let i = 0; i < n; i += len) {
            for (let k = 0; k < len / 2; k++) {
              const wr = Math.cos(ang * k)
              const wi = Math.sin(ang * k)
              const ar = re[i + k + len / 2] * wr - im[i + k + len / 2] * wi
              const ai = re[i + k + len / 2] * wi + im[i + k + len / 2] * wr
              re[i + k + len / 2] = re[i + k] - ar
              im[i + k + len / 2] = im[i + k] - ai
              re[i + k] += ar
              im[i + k] += ai
            }
          }
        }
        const mag = new Float64Array(n / 2)
        for (let i = 0; i < n / 2; i++) mag[i] = Math.hypot(re[i], im[i])
        return { mag, hz: RATE / n }
      }

      /** The waveform above (min and max of each column, the −12 dBFS line dashed), the spectrum to 4 kHz below. */
      function draw(canvas, data) {
        const W = 600
        const H = 200
        canvas.width = W * 2
        canvas.height = H * 2
        const c = canvas.getContext('2d')
        c.scale(2, 2)
        c.fillStyle = '#fffdf9'
        c.fillRect(0, 0, W, H)
        const mid = 50
        const amp = 48
        c.strokeStyle = '#ebe5da'
        c.beginPath()
        c.moveTo(0, mid)
        c.lineTo(W, mid)
        c.stroke()
        c.setLineDash([4, 3])
        c.strokeStyle = '#c96a3b'
        for (const y of [mid - amp * 0.25, mid + amp * 0.25]) {
          c.beginPath()
          c.moveTo(0, y)
          c.lineTo(W, y)
          c.stroke()
        }
        c.setLineDash([])
        c.fillStyle = '#26231f'
        // A fixed scale of time: three seconds across, so that lengths compare between sounds.
        const per = (3 * RATE) / W
        for (let x = 0; x < W; x++) {
          let lo = 0
          let hi = 0
          for (let i = Math.floor(x * per); i < Math.min(data.length, Math.floor((x + 1) * per)); i++) {
            lo = Math.min(lo, data[i])
            hi = Math.max(hi, data[i])
          }
          if (hi - lo > 0) c.fillRect(x, mid - hi * amp, 1, Math.max(0.5, (hi - lo) * amp))
        }
        const { mag, hz } = spectrum(data)
        const top = 110
        const h = 80
        let most = 0
        for (const m of mag) most = Math.max(most, m)
        c.fillStyle = '#6f6a62'
        c.font = '10px system-ui'
        for (const [name, f] of Object.entries(SCALE)) {
          const x = (f / 4000) * W
          c.fillStyle = '#ebe5da'
          c.fillRect(x, top, 1, h)
        }
        c.strokeStyle = '#2f6f9f'
        c.beginPath()
        for (let x = 0; x < W; x++) {
          const i = Math.round((x / W) * (4000 / hz))
          const v = Math.max(-60, db(mag[i] / most))
          const y = top + (-v / 60) * h
          x ? c.lineTo(x, y) : c.moveTo(x, y)
        }
        c.stroke()
        c.fillStyle = '#6f6a62'
        c.fillText('0 s', 2, 10)
        c.fillText('3 s', W - 18, 10)
        c.fillText('0 Hz', 2, top + h + 12)
        c.fillText('4 kHz', W - 30, top + h + 12)
        c.fillText('dashed: −12 dBFS', W - 92, mid + amp * 0.25 + 12)
      }

      const list = document.getElementById('list')
      const results = []
      for (const [name, words, detail] of SOUNDS) {
        const box = document.createElement('section')
        box.className = 'sound'
        const b = document.createElement('button')
        b.type = 'button'
        b.textContent = words
        b.addEventListener('click', async () => {
          live ??= new AudioContext()
          await live.resume()
          play(live, notes(name, detail), live.currentTime + 0.02)
        })
        const right = document.createElement('div')
        const canvas = document.createElement('canvas')
        const figures = document.createElement('p')
        figures.className = 'figures'
        right.append(canvas, figures)
        box.append(b, right)
        list.append(box)
        const data = await render(notes(name, detail))
        draw(canvas, data)
        const m = measure(data)
        figures.textContent = `${m.seconds} s · peak ${m.peakDb} dBFS · loudness ${m.rmsDb} dBFS RMS · first ${m.first}, last ${m.last}`
        results.push({ name, words, ...m })
      }
      // Two sounds at once, the loudest pair likely: a month ending as something opens.
      const both = await render([...notes('month', { change: 5 }), ...notes('opened')])
      results.push({ name: 'month+opened', words: 'A month ending as something opens', ...measure(both) })
      window.measured = results
    </script>
  </body>
</html>
