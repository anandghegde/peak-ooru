# Peak Ooru: an nginx site. Copy to /etc/nginx/sites-available/peak-ooru, change GAME.EXAMPLE.COM (three places) to
# the game's own name, link it into sites-enabled, and `nginx -t && systemctl reload nginx`. It touches no other site.
#
# The game and its map tiles are files; only /api reaches the service, on 127.0.0.1:5210.

# No access log for the game: the server keeps no addresses of machines, and neither should its front door
# (docs/SERVER.md, PRD MP-23). Errors are still logged, by nginx's own error log.

server {
    listen 80;
    listen [::]:80;
    server_name GAME.EXAMPLE.COM;
    # certbot's check of the name, if the certificate is renewed by the webroot method; otherwise to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name GAME.EXAMPLE.COM;

    # The certificates the machine has already (certbot's paths shown; use the ones your other sites use).
    ssl_certificate     /etc/letsencrypt/live/GAME.EXAMPLE.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/GAME.EXAMPLE.COM/privkey.pem;
    # If the machine has certbot's shared settings, they may be included instead of the two lines below.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:peakooru_ssl:10m;

    access_log off;

    root /srv/peak-ooru/www;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml;

    # The game's own files, named by their contents by the build: kept by browsers for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The map tiles: one archive read by range requests, so that only what is looked at is sent. Already compressed
    # inside, so not compressed again (which would also stop ranges). Kept a day, and checked after.
    location /tiles/ {
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        try_files $uri =404;
    }

    # The city's data (zones, roads, transit): not named by content, so checked with the server each time; compressed.
    location /data/ {
        add_header Cache-Control "public, no-cache" always;
        try_files $uri =404;
    }

    # The service. Addresses reach it only as X-Real-IP, for its limits, which it keeps in memory for at most an hour.
    location /api/ {
        proxy_pass http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 300k;
        proxy_read_timeout 60s;
        # The service answers every call itself; nginx adds nothing to what may be kept.
        proxy_buffering on;
    }

    # Slice 9: the share picture a finished game's browser sends up (PUT /api/games/<id>/picture). The service checks
    # every byte and keeps at most 400 KB; nginx lets a little over that through so that the service says why.
    location ~ ^/api/games/[A-Za-z0-9_-]+/picture$ {
        proxy_pass http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 410k;
        proxy_read_timeout 30s;
    }

    # Slice 9: a shared link, /share/<id>, is a small page the service makes for a chat's preview (its title, line and
    # picture), which sends a person on to /?city=<id>; /share/<id>.png is the picture. Both are made by the service.
    location /share/ {
        proxy_pass http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1k;
        proxy_read_timeout 15s;
    }

    # The page itself: never kept stale, so that a new version is seen at the next visit.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
